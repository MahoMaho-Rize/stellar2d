name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tier 1: CPU build + CPU tests ─────────────────────────────────
  cpu-build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CPU only)
        run: cmake -B build-cpu -DUSE_GPU=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cpu -j$(nproc)

      - name: Run CPU tests
        run: cd build-cpu && ctest --output-on-failure -j$(nproc)

  # ── Python linting (fast, catches import errors) ───────────────────
  python-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install numpy scipy pillow matplotlib

      - name: Syntax check scripts
        run: python -m py_compile scripts/render/render_video_fast.py && python -m py_compile scripts/render/render_cartesian.py
